<!doctype html>
<html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark"><meta name="theme-color" content="#ffffff"><title>YAMADA DOWN — Offline</title>
<style>
:root{--ink:#0a1c4a;--bg:#f4f9ff;--blue:#1f5bff}
@media(prefers-color-scheme:dark){:root{--ink:#e8efff;--bg:#070e24;--blue:#4b82ff}}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{min-height:100%;display:grid;place-content:center;gap:14px;text-align:center;padding:24px calc(24px + env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) calc(24px + env(safe-area-inset-left))}
h1{margin:0;font-size:1.6rem;letter-spacing:.08em;font-style:italic}
p{margin:0;opacity:.8;line-height:1.5;max-width:30ch}
button{justify-self:center;padding:14px 28px;border:0;background:var(--blue);color:#fff;font-weight:800;letter-spacing:.12em;transform:skewX(-8deg);font-size:.9rem}
</style></head><body><main>
<h1>OFFLINE</h1>
<p>Kamu sedang offline. Sambungkan internet lalu coba lagi. / You are offline. Reconnect and try again.</p>
<button onclick="location.href='/'">COBA LAGI / RETRY</button>
</main></body></html>
